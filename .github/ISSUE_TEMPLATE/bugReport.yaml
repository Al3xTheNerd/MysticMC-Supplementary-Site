
name: "Bug Report"
description: "Report something not working correctly."
title: "[BUG]: "
labels: ["Bug Report"]

body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: "Existing Issues"
      description: "Please check existing bug reports before submitting."
      options:
        - label: "I have checked the existing bug reports and confirmed this is not a duplicate."
          required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: "Expected Outcome"
      description: "What did you expect to happen?"
      placeholder: "Describe what should have happened."
    validations:
      required: true

  - type: textarea
    id: actual-outcome
    attributes:
      label: "Actual Outcome"
      description: "What actually happened?"
      placeholder: "Describe what happened instead."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Minimal Reproducible Example"
      description: "Provide steps, a code snippet, or a link that reproduces the issue."
      placeholder: |
        1. Navigate to...
        2. Click on...
        3. Observe the issue...
      render: markdown
    validations:
      required: false
